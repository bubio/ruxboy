name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "spikes/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "spikes/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"

jobs:
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout external/Rux submodule
        run: git submodule update --init --depth 1 external/Rux

      - name: Install dependencies
        run: brew install llvm@22 cmake ninja sdl3

      - name: Cache Rux compiler
        uses: actions/cache@v4
        id: cache-rux
        with:
          path: external/Rux/Bin
          key: rux-compiler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('external/Rux/**/*.cpp', 'external/Rux/**/*.h', 'external/Rux/Run.sh') }}

      - name: Build Rux compiler
        if: steps.cache-rux.outputs.cache-hit != 'true'
        working-directory: external/Rux
        run: sh Run.sh build --compiler "$(brew --prefix llvm@22)/bin/clang++"

      - name: Fetch Test ROMs
        run: sh scripts/fetch_test_roms.sh

      - name: Run Tests (Debug)
        run: sh scripts/test.sh

      - name: Run Tests (Release)
        run: sh scripts/test.sh --release

      - name: Build RuxBoy (Debug)
        run: sh scripts/build_macos.sh --debug

      - name: Build RuxBoy (Release)
        run: sh scripts/build_macos.sh --release

      - name: Verify binary exists
        run: |
          case "$(uname -m)" in
            arm64)  arch=AArch64 ;;
            x86_64) arch=x86-64 ;;
          esac
          bin="Packages/App/Bin/Release/macOS/$arch/RuxBoy"
          test -x "$bin" && echo "OK: $bin"

  build-linux:
    name: Build & Test (Linux)
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86-64
          - runner: ubuntu-26.04-arm
            arch: AArch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout external/Rux submodule
        run: git submodule update --init --depth 1 external/Rux

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl3-dev

      - name: Cache Rux compiler
        uses: actions/cache@v4
        id: cache-rux
        with:
          path: external/Rux/Bin
          key: rux-compiler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('external/Rux/**/*.cpp', 'external/Rux/**/*.h', 'external/Rux/Run.sh') }}

      - name: Build Rux compiler
        if: steps.cache-rux.outputs.cache-hit != 'true'
        working-directory: external/Rux
        run: sh Run.sh build --compiler /usr/bin/clang++-22

      - name: Fetch Test ROMs
        run: sh scripts/fetch_test_roms.sh

      - name: Run Tests (Debug)
        run: sh scripts/test.sh

      - name: Run Tests (Release)
        run: sh scripts/test.sh --release

      - name: Build RuxBoy (Debug)
        run: sh scripts/build_linux.sh --debug

      - name: Build RuxBoy (Release)
        run: sh scripts/build_linux.sh --release

      - name: Verify binary exists
        run: |
          bin="Packages/App/Bin/Release/Linux/${{ matrix.arch }}/RuxBoy"
          test -x "$bin" && echo "OK: $bin"

  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout external/Rux submodule
        shell: bash
        run: git submodule update --init --depth 1 external/Rux

      - name: Cache Rux compiler
        uses: actions/cache@v4
        id: cache-rux
        with:
          path: external/Rux/Bin
          key: rux-compiler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('external/Rux/**/*.cpp', 'external/Rux/**/*.h', 'external/Rux/Run.ps1') }}

      # ランナー既定のClangは22.1未満のため、external/RuxのRun.ps1が要求するバージョンを
      # インストーラ無し(管理者権限不要)のtar.xzアーカイブから取得する
      # (docs/dev/PLAN.md フェーズ9、ローカル検証で同じ方式を確認済み)。
      - name: Fetch LLVM 22
        if: steps.cache-rux.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile llvm.tar.xz
          New-Item -ItemType Directory -Force -Path llvm22 | Out-Null
          tar -xJf llvm.tar.xz -C llvm22 --strip-components=1
          Remove-Item llvm.tar.xz

      - name: Build Rux compiler
        if: steps.cache-rux.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: external/Rux
        run: |
          ./.github/scripts/Enter-VsDevEnv.ps1 -Arch amd64
          # windows-latestランナーはVS同梱のCommonExtensions\Microsoft\CMake配下にも
          # cmake.exe/ninja.exeを持ち、素のcmake.exe/ninja.exeと重複する。Run.ps1の
          # Find-ToolはGet-Command(-All無し)を使うため両方あると配列が返り、
          # Invoke-Checked -FilePathが[string]型変換エラーで失敗する
          # (ローカル実機でも踏んだ問題、docs/dev/phases/phase-09-cicd.md 5.1参照)。
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'CommonExtensions\\Microsoft\\CMake' }) -join ';'
          ./Run.ps1 build -Compiler "$env:GITHUB_WORKSPACE/llvm22/bin/clang++.exe"

      - name: Fetch Test ROMs
        shell: bash
        run: sh scripts/fetch_test_roms.sh

      - name: Fetch SDL3 runtime
        shell: bash
        run: sh scripts/fetch_sdl3_windows.sh

      - name: Run Tests (Debug)
        shell: bash
        run: sh scripts/test.sh

      - name: Run Tests (Release)
        shell: bash
        run: sh scripts/test.sh --release

      - name: Build RuxBoy (Debug)
        shell: bash
        run: sh scripts/build_windows.sh --debug

      - name: Build RuxBoy (Release)
        shell: bash
        run: sh scripts/build_windows.sh --release

      - name: Verify binary exists
        shell: bash
        run: |
          bin="Packages/App/Bin/Release/Windows/x86-64/RuxBoy.exe"
          test -f "$bin" && echo "OK: $bin"
